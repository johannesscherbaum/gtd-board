name: Release Obsidian Plugin

# Wird ausgeloest, wenn ein Git-Tag im Format "0.1.0" (ohne "v"-Praefix,
# passend zur manifest.json) gepusht wird. Baut main.js und haengt
# main.js, manifest.json und styles.css als Release-Assets an.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Fuer actions/attest-build-provenance: id-token zum Signieren, attestations
  # zum Veroeffentlichen der Attestation im Repo (siehe Schritt weiter unten).
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & test
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: node esbuild.config.mjs production

      # Erzeugt eine kryptographisch signierte Herkunfts-Attestation fuer main.js/styles.css
      # (belegt, dass sie aus genau diesem Workflow-Lauf/Commit dieses Repos stammen). Bewusst
      # nur fuer die beiden Build-Ausgaben, nicht fuer manifest.json - das ist eine statische,
      # im Repo eingecheckte Datei und kein Build-Artefakt.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            main.js manifest.json styles.css
