name: CI und Release

# Jeder Push auf main: Typpruefung und Tests (CI). Steht in manifest.json eine Version,
# zu der es noch kein Release gibt, wird zusaetzlich gebaut, attestiert und veroeffentlicht.
# Der Tag wird dabei vom Release selbst am geprueften Commit angelegt - Tag und Manifest
# stimmen dadurch immer ueberein. (Tags, die ein Workflow mit GITHUB_TOKEN anlegt, loesen
# keine weiteren Workflows aus; deshalb gibt es bewusst keinen separaten Tag-Workflow.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & test
        run: |
          npm run typecheck
          npm test

      - name: Release erforderlich?
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version existiert bereits - nur CI."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Versionen konsistent?
        if: steps.version.outputs.needed == 'true'
        run: |
          version=$(node -p "require('./manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          min=$(node -p "require('./manifest.json').minAppVersion")
          mapped=$(node -p "require('./versions.json')['$version'] || ''")
          [ "$version" = "$pkg" ] || { echo "::error::manifest.json ($version) und package.json ($pkg) weichen ab"; exit 1; }
          [ "$mapped" = "$min" ] || { echo "::error::versions.json hat fuer $version keinen Eintrag mit minAppVersion $min"; exit 1; }

      - name: Build
        if: steps.version.outputs.needed == 'true'
        run: node esbuild.config.mjs production

      - name: Attest build provenance
        if: steps.version.outputs.needed == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create GitHub Release
        if: steps.version.outputs.needed == 'true'
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes \
            main.js manifest.json styles.css
